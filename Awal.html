<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKYLIGHT — Interactive Game Intro with Characters</title>
  <style>
    :root {
      --bg-dark: #050811;
      --accent-gold: #fbbf24;
      --accent-cyan: #38bdf8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #game-wrapper {
      position: relative;
      width: 90vw;
      max-width: 900px;
      height: 80vh;
      max-height: 600px;
      background: #090d16;
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7),
                  0 0 30px rgba(56, 189, 248, 0.1);
      display: flex;
      flex-direction: column;
    }

    .game-header {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 20;
      background: linear-gradient(180deg, rgba(5,8,17,0.8) 0%, rgba(5,8,17,0) 100%);
    }

    .brand {
      font-size: 1.2rem;
      font-weight: 800;
      letter-spacing: 3px;
      color: #f8fafc;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-icon {
      width: 14px;
      height: 14px;
      border: 2px solid var(--accent-cyan);
      transform: rotate(45deg);
    }

    .status-badge {
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1px;
      padding: 4px 12px;
      border-radius: 20px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.3);
      color: var(--accent-cyan);
      text-transform: uppercase;
    }

    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .narrative-overlay {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      width: 80%;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    .narrative-text {
      font-size: 1.1rem;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: #e2e8f0;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
      min-height: 2.5em;
      transition: all 0.5s ease;
    }

    .controls-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 400px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      padding: 16px 24px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
    }

    .control-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
    }

    .slider-container {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    input[type=range] {
      -webkit-appearance: none;
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      height: 6px;
      border-radius: 3px;
      outline: none;
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-cyan);
      box-shadow: 0 0 10px var(--accent-cyan);
      cursor: pointer;
      transition: transform 0.1s ease;
    }

    input[type=range]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .btn {
      background: linear-gradient(135deg, #38bdf8, #0284c7);
      color: #0f172a;
      border: none;
      padding: 10px 24px;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.9rem;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.6);
    }

    .target-info {
      font-size: 0.85rem;
      color: var(--accent-gold);
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .target-info.visible {
      opacity: 1;
    }

    .mode-switch {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 25;
      display: flex;
      gap: 8px;
    }

    .mode-btn {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #94a3b8;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .mode-btn.active {
      background: var(--accent-cyan);
      color: #0f172a;
      box-shadow: 0 0 12px var(--accent-cyan);
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
      background: radial-gradient(circle, transparent 40%, rgba(5,8,17,0.8) 100%);
    }

    @media (max-width: 600px) {
      .narrative-text { font-size: 0.95rem; }
      .controls-panel { width: 95%; padding: 12px 16px; }
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <!-- Header -->
    <div class="game-header">
      <div class="brand">
        <div class="brand-icon"></div>
        SKYLIGHT
      </div>
      <div class="status-badge" id="stage-badge">CHAPTER 0: INTRO</div>
    </div>

    <!-- Mode Toggle (Day/Night) -->
    <div class="mode-switch">
      <button class="mode-btn active" id="btn-day" title="Day Mode">☀️</button>
      <button class="mode-btn" id="btn-night" title="Night Mode">🌙</button>
    </div>

    <!-- Viewport Canvas Area -->
    <div id="viewport">
      <canvas id="gameCanvas"></canvas>
      <div class="vignette"></div>

      <!-- Narrative Overlay -->
      <div class="narrative-overlay">
        <p class="narrative-text" id="narrative"></p>
      </div>

      <!-- Controls Panel -->
      <div class="controls-panel" id="controls">
        <div class="control-label" id="control-label">Press start to awaken your ceiling</div>
        
        <button class="btn" id="action-btn">
          <span>AWAKEN SKYLIGHT</span>
        </button>

        <div class="slider-container" id="slider-box" style="display: none;">
          <span style="font-size: 0.8rem;">🔒</span>
          <input type="range" id="skylight-slider" min="0" max="100" value="0">
          <span style="font-size: 0.8rem;">☀️</span>
        </div>

        <div class="target-info" id="target-info">
          🎯 Align Light Beam to Energy Core
        </div>
      </div>
    </div>
  </div>

  <script>
    // Audio Synthesizer
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
      },
      playChime() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(523.25, now);
        osc.frequency.exponentialRampToValueAtTime(1046.50, now + 1.2);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 1.5);
      },
      playSlideSound() {
        if (!this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(120, now);
        osc.frequency.linearRampToValueAtTime(80, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let width, height;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      width = canvas.width;
      height = canvas.height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Game State
    const state = {
      stage: 0,
      aperture: 0,
      prismAngle: 0,
      mode: 'day',
      dustParticles: [],
      stars: [],
      targetCore: { x: 0, y: 0, hit: false },
      animTime: 0
    };

    // Generate Stars & Dust
    for (let i = 0; i < 80; i++) {
      state.stars.push({ x: Math.random(), y: Math.random(), size: Math.random() * 2 + 0.5, alpha: Math.random(), speed: Math.random() * 0.02 + 0.005 });
    }
    for (let i = 0; i < 60; i++) {
      state.dustParticles.push({ x: Math.random(), y: Math.random(), size: Math.random() * 2 + 1, vx: (Math.random() - 0.5) * 0.0005, vy: (Math.random() - 0.5) * 0.0005 + 0.0002, alpha: Math.random() * 0.6 + 0.2 });
    }

    const narrativeEl = document.getElementById('narrative');
    const actionBtn = document.getElementById('action-btn');
    const sliderBox = document.getElementById('slider-box');
    const skylightSlider = document.getElementById('skylight-slider');
    const controlLabel = document.getElementById('control-label');
    const targetInfo = document.getElementById('target-info');
    const stageBadge = document.getElementById('stage-badge');
    const btnDay = document.getElementById('btn-day');
    const btnNight = document.getElementById('btn-night');

    const texts = [
      "Every room is trapped in darkness. Yours holds a hidden gateway.",
      "Slide open the Skylight ceiling panel to invite the first beam of light.",
      "Adjust the prism lens angle to channel light into the room's Energy Core.",
      "Mastery achieved. Your room is now alive with guardians of light and stars!"
    ];

    function typeWriter(text, element) {
      element.textContent = '';
      let i = 0;
      const timer = setInterval(() => {
        if (i < text.length) {
          element.textContent += text.charAt(i);
          i++;
        } else {
          clearInterval(timer);
        }
      }, 25);
    }

    typeWriter(texts[0], narrativeEl);

    actionBtn.addEventListener('click', () => {
      AudioEngine.init();
      AudioEngine.playChime();
      if (state.stage === 0) {
        state.stage = 1;
        stageBadge.textContent = "STAGE 1: UNLOCK CEILING";
        typeWriter(texts[1], narrativeEl);
        actionBtn.style.display = 'none';
        sliderBox.style.display = 'flex';
        controlLabel.textContent = "DRAG TO OPEN SKYLIGHT PANEL";
      }
    });

    skylightSlider.addEventListener('input', (e) => {
      AudioEngine.playSlideSound();
      const val = parseFloat(e.target.value);
      if (state.stage === 1) {
        state.aperture = val;
        if (val >= 95) {
          state.stage = 2;
          stageBadge.textContent = "STAGE 2: PRISM ALIGNMENT";
          typeWriter(texts[2], narrativeEl);
          skylightSlider.value = 50;
          skylightSlider.min = -45;
          skylightSlider.max = 45;
          state.prismAngle = 0;
          controlLabel.textContent = "ROTATE PRISM ANGLE";
          targetInfo.classList.add('visible');
        }
      } else if (state.stage === 2) {
        state.prismAngle = val;
      }
    });

    btnDay.addEventListener('click', () => {
      state.mode = 'day';
      btnDay.classList.add('active');
      btnNight.classList.remove('active');
    });

    btnNight.addEventListener('click', () => {
      state.mode = 'night';
      btnNight.classList.add('active');
      btnDay.classList.remove('active');
    });

    // Function to draw Characters (Solar Guardian vs Stargazer Sprite)
    function drawCharacters(x, y) {
      ctx.save();
      const floatOffset = Math.sin(state.animTime * 3) * 6; // Animasi mengapung halus
      const charY = y + floatOffset;

      if (state.mode === 'day') {
        // --- CHARACTER 1: SOLIS (The Sun Guardian - Bernuansa emas & bercahaya) ---
        // Glow / Aura
        const aura = ctx.createRadialGradient(x, charY, 5, x, charY, 40);
        aura.addColorStop(0, 'rgba(251, 191, 36, 0.4)');
        aura.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(x, charY, 40, 0, Math.PI * 2);
        ctx.fill();

        // Badan / Jubah Solis
        ctx.fillStyle = '#d97706';
        ctx.beginPath();
        ctx.moveTo(x - 15, charY + 25);
        ctx.lineTo(x + 15, charY + 25);
        ctx.lineTo(x, charY - 10);
        ctx.closePath();
        ctx.fill();

        // Kepala / Mahkota Matahari
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc(x, charY - 12, 12, 0, Math.PI * 2);
        ctx.fill();

        // Mata Berbinar
        ctx.fillStyle = '#fff';
        ctx.fillRect(x - 4, charY - 15, 3, 3);
        ctx.fillRect(x + 2, charY - 15, 3, 3);

        // Dialog / Teks Karakter Siang
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#fde68a';
        ctx.textAlign = 'center';
        ctx.fillText("☀️ Solis: 'Bask in the warmth!'", x, charY - 32);

      } else {
        // --- CHARACTER 2: LUNA (The Stargazer Sprite - Bernuansa ungu & kosmik) ---
        // Glow / Aura Kosmik
        const aura = ctx.createRadialGradient(x, charY, 5, x, charY, 40);
        aura.addColorStop(0, 'rgba(129, 140, 248, 0.4)');
        aura.addColorStop(1, 'rgba(129, 140, 248, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(x, charY, 40, 0, Math.PI * 2);
        ctx.fill();

        // Sayap Bintang / Jubah Luna
        ctx.fillStyle = '#4f46e5';
        ctx.beginPath();
        ctx.ellipse(x, charY + 5, 14, 20, 0, 0, Math.PI * 2);
        ctx.fill();

        // Kepala / Wajah Luna
        ctx.fillStyle = '#818cf8';
        ctx.beginPath();
        ctx.arc(x, charY - 12, 11, 0, Math.PI * 2);
        ctx.fill();

        // Mata Lembut
        ctx.fillStyle = '#c7d2fe';
        ctx.fillRect(x - 4, charY - 14, 3, 4);
        ctx.fillRect(x + 2, charY - 14, 3, 4);

        // Dialog / Teks Karakter Malam
        ctx.font = '11px sans-serif';
        ctx.fillStyle = '#c7d2fe';
        ctx.textAlign = 'center';
        ctx.fillText("🌙 Luna: 'The stars whisper secrets.'", x, charY - 32);
      }

      ctx.restore();
    }

    function render() {
      state.animTime += 0.03;
      ctx.clearRect(0, 0, width, height);

      // Room Background
      ctx.fillStyle = "#070b14";
      ctx.fillRect(0, 0, width, height);

      const skylightWidth = width * 0.45;
      const skylightHeight = height * 0.22;
      const skylightX = (width - skylightWidth) / 2;
      const skylightY = height * 0.12;

      // Sky View
      ctx.save();
      ctx.beginPath();
      ctx.rect(skylightX, skylightY, skylightWidth, skylightHeight);
      ctx.clip();

      if (state.mode === 'day') {
        const skyGradient = ctx.createLinearGradient(0, skylightY, 0, skylightY + skylightHeight);
        skyGradient.addColorStop(0, '#38bdf8');
        skyGradient.addColorStop(1, '#e0f2fe');
        ctx.fillStyle = skyGradient;
        ctx.fillRect(skylightX, skylightY, skylightWidth, skylightHeight);

        const sunX = skylightX + skylightWidth * 0.7;
        const sunY = skylightY + skylightHeight * 0.4;
        const sunGlow = ctx.createRadialGradient(sunX, sunY, 5, sunX, sunY, 60);
        sunGlow.addColorStop(0, '#fff');
        sunGlow.addColorStop(0.3, 'rgba(251, 191, 36, 0.8)');
        sunGlow.addColorStop(1, 'rgba(251, 191, 36, 0)');
        ctx.fillStyle = sunGlow;
        ctx.fillRect(skylightX, skylightY, skylightWidth, skylightHeight);
      } else {
        const nightGrad = ctx.createLinearGradient(0, skylightY, 0, skylightY + skylightHeight);
        nightGrad.addColorStop(0, '#020617');
        nightGrad.addColorStop(1, '#1e1b4b');
        ctx.fillStyle = nightGrad;
        ctx.fillRect(skylightX, skylightY, skylightWidth, skylightHeight);

        state.stars.forEach(s => {
          s.alpha += s.speed;
          if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
          ctx.beginPath();
          ctx.arc(skylightX + s.x * skylightWidth, skylightY + s.y * skylightHeight, s.size, 0, Math.PI * 2);
          ctx.fill();
        });
      }
      ctx.restore();

      // Shutters
      const openOffset = (state.aperture / 100) * (skylightWidth / 2);
      ctx.fillStyle = "#1e293b";
      ctx.strokeStyle = "#334155";
      ctx.lineWidth = 2;
      ctx.fillRect(skylightX, skylightY, (skylightWidth / 2) - openOffset, skylightHeight);
      ctx.strokeRect(skylightX, skylightY, (skylightWidth / 2) - openOffset, skylightHeight);
      ctx.fillRect(skylightX + (skylightWidth / 2) + openOffset, skylightY, (skylightWidth / 2) - openOffset, skylightHeight);
      ctx.strokeRect(skylightX + (skylightWidth / 2) + openOffset, skylightY, (skylightWidth / 2) - openOffset, skylightHeight);

      ctx.strokeStyle = '#38bdf8';
      ctx.lineWidth = 3;
      ctx.strokeRect(skylightX, skylightY, skylightWidth, skylightHeight);

      // Light Beam & Characters
      if (state.aperture > 0) {
        const openingRatio = state.aperture / 100;
        const beamTopWidth = skylightWidth * openingRatio;
        const beamTopX = skylightX + (skylightWidth - beamTopWidth) / 2;
        
        const angleRad = (state.prismAngle * Math.PI) / 180;
        const beamBottomOffset = Math.sin(angleRad) * width * 0.4;
        const beamBottomX1 = beamTopX - 100 + beamBottomOffset;
        const beamBottomX2 = beamTopX + beamTopWidth + 100 + beamBottomOffset;
        const beamBottomY = height;

        ctx.save();
        const beamGradient = ctx.createLinearGradient(0, skylightY, 0, height);
        if (state.mode === 'day') {
          beamGradient.addColorStop(0, `rgba(255, 255, 255, ${0.4 * openingRatio})`);
          beamGradient.addColorStop(0.5, `rgba(56, 189, 248, ${0.2 * openingRatio})`);
          beamGradient.addColorStop(1, `rgba(251, 191, 36, 0)`);
        } else {
          beamGradient.addColorStop(0, `rgba(129, 140, 248, ${0.3 * openingRatio})`);
          beamGradient.addColorStop(1, `rgba(15, 23, 42, 0)`);
        }
        ctx.beginPath();
        ctx.moveTo(beamTopX, skylightY + skylightHeight);
        ctx.lineTo(beamTopX + beamTopWidth, skylightY + skylightHeight);
        ctx.lineTo(beamBottomX2, beamBottomY);
        ctx.lineTo(beamBottomX1, beamBottomY);
        ctx.closePath();
        ctx.fillStyle = beamGradient;
        ctx.fill();
        ctx.restore();

        // Energy Core Target
        state.targetCore.x = width * 0.3 + (skylightWidth * 0.2);
        state.targetCore.y = height * 0.7;

        const beamCenterX = (beamBottomX1 + beamBottomX2) / 2;
        const distToCore = Math.abs(beamCenterX - state.targetCore.x);
        
        if (state.stage === 2 && distToCore < 45) {
          state.stage = 3;
          stageBadge.textContent = "STAGE 3: COMPLETED";
          typeWriter(texts[3], narrativeEl);
          AudioEngine.playChime();
          targetInfo.style.color = "#4ade80";
          targetInfo.innerHTML = "✨ Energy Core Fully Activated!";
        }

        ctx.save();
        ctx.beginPath();
        ctx.arc(state.targetCore.x, state.targetCore.y, 22, 0, Math.PI * 2);
        ctx.fillStyle = state.targetCore.hit ? '#4ade80' : 'rgba(251, 191, 36, 0.3)';
        ctx.shadowColor = state.targetCore.hit ? '#4ade80' : '#fbbf24';
        ctx.shadowBlur = state.targetCore.hit ? 25 : 10;
        ctx.fill();
        ctx.strokeStyle = state.targetCore.hit ? '#ffffff' : '#fbbf24';
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();

        // --- MENGHADIRKAN KARAKTER DI DALAM RUANGAN ---
        // Karakter muncul di sisi kanan bawah ruangan
        drawCharacters(width * 0.72, height * 0.65);

        // Dust particles
        ctx.fillStyle = state.mode === 'day' ? 'rgba(255, 255, 255, 0.8)' : 'rgba(199, 210, 254, 0.8)';
        state.dustParticles.forEach(p => {
          p.x += p.vx;
          p.y += p.vy;
          if (p.x < 0) p.x = 1;
          if (p.x > 1) p.x = 0;
          if (p.y < 0) p.y = 1;
          if (p.y > 1) p.y = 0;
          const px = p.x * width;
          const py = p.y * height;
          if (py > skylightY + skylightHeight) {
            ctx.beginPath();
            ctx.arc(px, py, p.size, 0, Math.PI * 2);
            ctx.fill();
          }
        });
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
